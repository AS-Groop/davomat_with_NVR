# MMTRI Davomat tizimi — nginx sozlamasi
# Lokal tarmoq uchun: http://davomat.uz (mobil ilova) va http://davomat.uz:8080 (dashboard)
#
# DNS allaqachon tayyor (sysadmin tomonidan) — "davomat.uz" so'ralsa shu
# serverga keladi. Bu fayl faqat kelgan so'rovni to'g'ri ilovaga yo'naltiradi.

# ── Mobil ilova (xodimlar, HR) — http://davomat.uz ──
server {
    listen 80;
    listen [::]:80;
    server_name davomat.uz;

    client_max_body_size 10m;  # xodim rasmi yuklash uchun (ilova 8MB gacha ruxsat beradi)

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Dashboard (katta ekran) — http://davomat.uz:8080 ──
# mobile_api.py'dan farqli, dashboard xavfsizlik uchun faqat 127.0.0.1'da
# ishlaydi (DASHBOARD_BIND=127.0.0.1, .env'da) — shu sabab tashqaridan
# ko'rinishi uchun ALBATTA shu nginx bloki kerak (to'g'ridan-to'g'ri
# 8080-portga ulanib bo'lmaydi).
server {
    listen 8080;
    listen [::]:8080;
    server_name davomat.uz;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

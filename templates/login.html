<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirish — Situatsion Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --panel:#111827;
  --border:rgba(255,255,255,0.08);
  --text:#e5e7eb;
  --muted:#6b7280;
  --accent:#34d399;
  --danger:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Manrope',sans-serif;
  background:radial-gradient(ellipse at top,#1e293b 0%,var(--bg) 60%);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.card{
  width:100%;max-width:380px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:40px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 0 1px rgba(52,211,153,.05) inset;
}
.title{
  font-family:'Bricolage Grotesque',serif;
  font-size:24px;font-weight:600;
  letter-spacing:-.02em;
  margin-bottom:6px;
}
.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:28px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.05em;
}
label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--muted);
  margin-bottom:8px;
}
input{
  width:100%;
  background:#0a0e1a;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  letter-spacing:.05em;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(52,211,153,.12);
}
button{
  margin-top:20px;
  width:100%;
  background:var(--accent);
  color:#0a0e1a;
  border:0;border-radius:10px;
  padding:14px;
  font-family:'Manrope',sans-serif;
  font-size:14px;font-weight:600;
  letter-spacing:.04em;
  cursor:pointer;
  transition:transform .1s,background .2s;
}
button:hover{background:#10b981}
button:active{transform:translateY(1px)}
.err{
  color:var(--danger);
  font-size:13px;
  margin-bottom:14px;
  padding:10px 12px;
  background:rgba(248,113,113,.08);
  border:1px solid rgba(248,113,113,.2);
  border-radius:8px;
}
.foot{
  margin-top:24px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--muted);
  text-align:center;
  letter-spacing:.1em;
}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="title">Situatsion Monitoring</div>
  <div class="sub">HR Tezkor markaz · kirish</div>
  {{error_block}}
  <label for="p">Parol</label>
  <input id="p" type="password" name="password" autofocus autocomplete="current-password" required>
  <button type="submit">Kirish</button>
  <div class="foot">himoyalangan kirish · sessiya 30 kun</div>
</form>
</body>
</html>
